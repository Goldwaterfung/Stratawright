name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  build-and-package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    defaults:
      run:
        shell: bash

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg_cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-binary-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-${{ matrix.os }}-

      - name: Cache third-party SDKs
        uses: actions/cache@v4
        with:
          path: src/third_party
          key: third-party-sdks-${{ hashFiles('scripts/setup_third_party.sh') }}
          restore-keys: |
            third-party-sdks-

      - name: Setup Third-Party SDKs
        run: |
          bash scripts/setup_third_party.sh

      - name: Setup vcpkg
        run: |
          mkdir -p "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"
          bash scripts/setup_vcpkg.sh

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress

      - name: Configure CMake (Release)
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DENABLE_SIMD=ON \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build (Release)
        run: |
          cmake --build build --config Release --parallel

      - name: Run Unit Tests
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Package with CPack
        run: |
          cd build
          cpack -C Release

      - name: Post-process package (macOS)
        if: runner.os == 'macOS'
        run: |
          PKG_FILE=$(find build -maxdepth 1 -name "*.pkg" -print -quit)
          if [ -n "$PKG_FILE" ]; then
            echo "Patching $PKG_FILE..."
            bash scripts/packaging/patch_pkg.sh "$PKG_FILE"
          fi

      - name: Stage Release Artifacts
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" == "macOS" ]; then
            find build -maxdepth 1 \( -name "*.pkg" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist/ \;
          else
            find build -maxdepth 1 \( -name "*.exe" -o -name "*.zip" -o -name "*.msi" \) -exec cp {} dist/ \;
          fi
          echo "Staged artifacts in dist/:"
          ls -la dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-packages-*
          path: release_assets
          merge-multiple: true

      - name: List Release Assets
        run: |
          echo "Release Assets ready for upload:"
          ls -la release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release_assets/*
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: false
          generate_release_notes: true

